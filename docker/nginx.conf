# The validator SPA's nginx (PLAN-ci-snapshots-and-container-images D6): static files + a
# same-origin proxy of the API to corej-rest. Rendered from a template by the official image at
# start-up; ${API_UPSTREAM} and ${BRAND} are the only substituted variables (Dockerfile.runtime:
# NGINX_ENVSUBST_FILTER). Ported from the rule editor SPA's docker/nginx.conf — the
# static half (CSP, headers, /brand/) is the same; the /api/ limits are NOT (review M1, below).
#
# This is the reference configuration for ANY reverse proxy in front of the two apps: what it
# forwards, and that it forwards it on the same origin, is the contract (the SPA's API client is
# same-origin, src/api/client.ts; every API path is under /api, openapi.snapshot.json).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, the OpenAPI document and Swagger UI go to corej-rest unchanged.
    # Host is $http_host — the browser's host WITH its port — never $host (no port): Spring
    # compares a request's Origin with scheme://Host, so behind a published port a portless
    # Host makes a same-origin POST look cross-origin.
    location ^~ /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ⚠ NOT the rule editor's limits (review M1). The SPA uploads study datasets as
        # multipart (src/api/sessions.ts uploadFile), and corej-rest accepts up to 512 MB
        # (spring.servlet.multipart.max-file-size / max-request-size in its application.yaml,
        # COREJ_MAX_UPLOAD in its compose file). Keep this EQUAL to corej-rest's multipart
        # limit — raise both together: below it nginx answers 413 to an upload the service
        # would take.
        client_max_body_size 512m;
        # Stream the upload to corej-rest instead of spooling up to 512 MB into the container
        # first (nginx's default buffers the whole body to a temp file before proxying).
        proxy_request_buffering off;
        # Sized for a validation run (a synchronous request can last as long as the run), not
        # for a page load.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $http_host;
    }
    location ^~ /swagger-ui {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $http_host;
    }
    location = /swagger-ui.html {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $http_host;
    }

    # The SPA's own responses carry the security headers. ⚠ nginx inherits add_header from the
    # server level ONLY into a location that has none of its own, and the locations below set
    # Cache-Control — so the headers are repeated in each. corej-rest sets its own on /api.
    #
    # The CSP is the rule editor's (same kit: Mantine writes <style> elements, CodeMirror
    # injects its theme at run time): scripts only from this origin, styles from this origin
    # plus inline, images also as data: / blob:, fetches only to this origin, never framed.
    # ⚠ Not yet measured against THIS SPA in a headless browser — the first container run
    # confirms it (docker/DOCKER.md, troubleshooting).

    # Hashed Vite assets: immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The brand (PLAN-web-branding-and-theme §5.5): the SPA always loads /brand/brand.css, and
    # /brand/ is the folder ${BRAND} names under brands/ (substituted at start-up; the default is
    # neutral, docker/25-cumba-brand.sh has refused to start on a name without a brand.css).
    # Extra brands are mounted at /usr/share/nginx/html/brands/<name>. no-cache so an edited
    # brand shows on reload; the security headers repeated (see the note above).
    location ^~ /brand/ {
        alias /usr/share/nginx/html/brands/${BRAND}/;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # A deep link lands on index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
